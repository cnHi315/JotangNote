server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端路由交给 index.html，刷新 /mynotes 这类地址不会 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 去掉 /api 前缀，转给后端
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
