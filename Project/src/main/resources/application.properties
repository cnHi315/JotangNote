spring.application.name=demo
# 数据源
spring.datasource.url=jdbc:mysql://localhost:3306/jotangnote?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=959783
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 启动时执行 schema.sql
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# MyBatis 配置
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath:com/example/mapper/*.xml
mybatis.type-aliases-package=com.example.entity

# 默认 INFO
logging.level.root=info
logging.level.com.example=debug
# MyBatis SQL 日志
logging.level.com.example.mapper=debug
# 日志文件位置
logging.file.name=logs/jotangnote.log

# JWT 配置
jwt.secret=${JWT_SECRET_KEY:jotangnote-secret-key-2952703082}
jwt.expire-days=7